name: Deploy

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options: [dev, prod]
        default: dev

permissions:
  id-token: write
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-dev.txt

      - run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - working-directory: frontend
        run: npm ci

      - working-directory: frontend
        run: npm test

  deploy:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
    concurrency:
      group: deploy-${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve environment
        id: env
        shell: bash
        run: echo "name=${{ github.event.inputs.environment || (github.ref == 'refs/heads/main' && 'prod' || 'dev') }}" >> "$GITHUB_OUTPUT"

      - name: Resolve app name
        id: apps
        shell: bash
        run: |
          RG="${{ vars.RESOURCE_GROUP }}"
          APP=$(az webapp list -g "$RG" --query "[0].name" -o tsv)
          if [ -z "$APP" ]; then
            echo "Could not find a web app in resource group '$RG'." >&2
            exit 1
          fi
          echo "resource_group=$RG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"

      - name: ACR login
        shell: bash
        run: az acr login --name sharedacra7edb0c9

      - name: Build image
        shell: bash
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_ENTRA_CLIENT_ID="${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg NEXT_PUBLIC_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
            -t sharedacra7edb0c9.azurecr.io/memedb/app:${{ steps.env.outputs.name }} .

      - name: Push image
        shell: bash
        run: docker push sharedacra7edb0c9.azurecr.io/memedb/app:${{ steps.env.outputs.name }}

      - name: Restart web app
        shell: bash
        run: |
          az webapp restart \
            --resource-group "${{ steps.apps.outputs.resource_group }}" \
            --name "${{ steps.apps.outputs.app }}"
